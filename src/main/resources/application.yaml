spring:
  config:
    import: optional:file:./deploy/postgres.properties
  application:
    name: api

  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
      file-size-threshold: 0

  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:findlocally}
    username: ${POSTGRES_USER:sa}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  sql:
    init:
      mode: always
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  bookings:
    time-zone: ${BOOKING_TIME_ZONE:Asia/Kolkata}
    # Proposed product defaults; revisions never extend the original request hold.
    request-response-hours: ${BOOKING_REQUEST_RESPONSE_HOURS:24}
    quotation-response-hours: ${BOOKING_QUOTATION_RESPONSE_HOURS:12}
    expiry-delay-ms: ${BOOKING_EXPIRY_DELAY_MS:30000}
  auth:
    password-reset:
      from: ${MAIL_FROM:}
      url: ${PASSWORD_RESET_URL:http://localhost:4200/reset-password}
    jwt-secret: ${JWT_SECRET:uwVv6uQDW1ArLm3kDNdEC3X2hBPn0gRvNT3JP0yT9xo=}
  cors:
    allowed-origins: http://localhost:4200
  media:
    # Proposed product defaults. Install ffprobe and ffmpeg for video/WebP inspection.
    image-limit-mib: ${MEDIA_IMAGE_LIMIT_MIB:10}
    video-limit-mib: ${MEDIA_VIDEO_LIMIT_MIB:100}
    max-video-seconds: ${MEDIA_MAX_VIDEO_SECONDS:600}
    max-dimension: ${MEDIA_MAX_DIMENSION:8192}
    ffprobe: ${MEDIA_FFPROBE:ffprobe}
    ffmpeg: ${MEDIA_FFMPEG:ffmpeg}
    request-timeout-seconds: ${S3_REQUEST_TIMEOUT_SECONDS:120}
    bucket: ${S3_BUCKET:find-locally-identity-bucket}
    region: ${AWS_REGION:ap-south-1}
    public-base-url: ${S3_PUBLIC_BASE_URL:https://find-locally-identity-bucket.s3.ap-south-1.amazonaws.com/}
    # AWS SDK credentials: use an IAM role, an AWS profile, or environment variables
    # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and (for temporary credentials) AWS_SESSION_TOKEN.
